# T-126 lab test 2: Run:ai GPU fractions on the AMD GPU, scheduled by the patched KAI. In project team-c (1 AMD GPU of
# quota): frac-a and frac-b ask for half a GPU each in pool amd and share the W7900; frac-c, a third half, waits on
# quota. nv-frac-a/b: the same on pool nvidia, which must still work as before (NVIDIA fractions, T-108).
apiVersion: v1
kind: ConfigMap
metadata: {name: t126-probe, namespace: runai-team-c}
data:
  probe.py: |
    import os, time, torch
    print("OIF_GPU_PCI=%s OIF_GPU_MEMORY_FRACTION=%s" % (os.environ.get("OIF_GPU_PCI"), os.environ.get("OIF_GPU_MEMORY_FRACTION")))
    print("GPU visible:", torch.cuda.is_available())
    frac = float(os.environ.get("OIF_GPU_MEMORY_FRACTION", "1")) - 0.05
    torch.cuda.set_per_process_memory_fraction(frac)
    free, total = torch.cuda.mem_get_info()
    x = torch.empty(int(total * (frac - 0.05)) // 2, dtype=torch.float16, device="cuda")
    print("%s: %.1f GiB total, holding %.1f GiB" % (torch.cuda.get_device_name(0), total / 2**30, x.numel() * 2 / 2**30))
    a = torch.randn(8192, 8192, device="cuda", dtype=torch.float16); t0 = time.time(); n = 0
    while time.time() - t0 < 120: (a @ a).sum().item(); n += 1
    print("TFLOPS over 120 s: %.1f" % (n * 2 * 8192**3 / 120 / 1e12))
    time.sleep(600)
---
apiVersion: v1
kind: Pod
metadata:
  name: frac-a
  namespace: runai-team-c
  labels: {runai/node-pool: amd, app.kubernetes.io/part-of: oif-t126}
  annotations: {gpu-fraction: "0.5"}
spec:
  schedulerName: runai-scheduler
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: docker.io/rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
      command: [python3, -u, /probe/probe.py]
      volumeMounts: [{name: probe, mountPath: /probe}]
  volumes: [{name: probe, configMap: {name: t126-probe}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: frac-b
  namespace: runai-team-c
  labels: {runai/node-pool: amd, app.kubernetes.io/part-of: oif-t126}
  annotations: {gpu-fraction: "0.5"}
spec:
  schedulerName: runai-scheduler
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: docker.io/rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
      command: [python3, -u, /probe/probe.py]
      volumeMounts: [{name: probe, mountPath: /probe}]
  volumes: [{name: probe, configMap: {name: t126-probe}}]
---

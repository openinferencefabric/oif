apiVersion: v1
kind: Pod
metadata:
  name: nv-frac-a
  namespace: runai-team-c
  labels: {runai/node-pool: nvidia, app.kubernetes.io/part-of: oif-t126}
  annotations: {gpu-fraction: "0.5"}
spec:
  schedulerName: runai-scheduler
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:

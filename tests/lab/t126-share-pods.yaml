# T-126 lab test 1 (docs/evidence/T-126/01-nri-plugin.txt): the oif-amd-share NRI plugin gives pods the W7900 without amd.com/gpu and without privileges.
# a, b: share the GPU (0.5 each); c: no annotation (control, sees no GPU); d: names a GPU that is not there (refused).
apiVersion: v1
kind: Namespace
metadata: {name: oif-t126}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: probe, namespace: oif-t126}
data:
  probe.py: |
    import os, time, torch
    print("OIF_GPU_PCI=%s OIF_GPU_MEMORY_FRACTION=%s" % (os.environ.get("OIF_GPU_PCI"), os.environ.get("OIF_GPU_MEMORY_FRACTION")))
    print("devices:", sorted(os.listdir("/dev/dri")) if os.path.isdir("/dev/dri") else "-", "kfd:", os.path.exists("/dev/kfd"))
    print("GPU visible:", torch.cuda.is_available())
    if torch.cuda.is_available():
        frac = float(os.environ.get("OIF_GPU_MEMORY_FRACTION", "1")) - 0.05
        torch.cuda.set_per_process_memory_fraction(frac)
        free, total = torch.cuda.mem_get_info()
        x = torch.empty(int(total * (frac - 0.05)) // 2, dtype=torch.float16, device="cuda")
        print("%s: %.1f GiB total, holding %.1f GiB" % (torch.cuda.get_device_name(0), total / 2**30, x.numel() * 2 / 2**30))
        a = torch.randn(8192, 8192, device="cuda", dtype=torch.float16); t0 = time.time(); n = 0
        while time.time() - t0 < 60: (a @ a).sum().item(); n += 1
        print("TFLOPS over 60 s: %.1f" % (n * 2 * 8192**3 / 60 / 1e12))
---
apiVersion: v1
kind: Pod
metadata:
  name: share-a
  namespace: oif-t126
  annotations: {oif.ai/amd-gpu: "0000:03:00.0", oif.ai/amd-gpu-fraction: "0.5"}
spec:
  nodeName: gpu-amd
  restartPolicy: Never
  containers:
    - name: main
      image: docker.io/rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
      command: [python3, -u, /probe/probe.py]
      volumeMounts: [{name: probe, mountPath: /probe}]
  volumes: [{name: probe, configMap: {name: probe}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: share-b
  namespace: oif-t126
  annotations: {oif.ai/amd-gpu: "0000:03:00.0", oif.ai/amd-gpu-fraction: "0.5"}
spec:
  nodeName: gpu-amd
  restartPolicy: Never
  containers:
    - name: main
      image: docker.io/rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
      command: [python3, -u, /probe/probe.py]
      volumeMounts: [{name: probe, mountPath: /probe}]
  volumes: [{name: probe, configMap: {name: probe}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: control-c
  namespace: oif-t126
spec:
  nodeName: gpu-amd
  restartPolicy: Never
  containers:
    - name: main
      image: docker.io/rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
      command: [python3, -u, /probe/probe.py]
      volumeMounts: [{name: probe, mountPath: /probe}]
  volumes: [{name: probe, configMap: {name: probe}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: wrong-gpu-d
  namespace: oif-t126
  annotations: {oif.ai/amd-gpu: "0000:09:00.0"}
spec:
  nodeName: gpu-amd
  restartPolicy: Never
  containers:
    - name: main
      image: docker.io/rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0@sha256:099f59a3bee9c436f5cc57db6bc6076fdeda579c57e9e22ae40f856d5905b3e4
      command: [python3, -u, /probe/probe.py]
      volumeMounts: [{name: probe, mountPath: /probe}]
  volumes: [{name: probe, configMap: {name: probe}}]
